name: .NET build

on:
  push:
    paths:
      - ".net/**"
      - "Directory.Build.props"
      - "Directory.Build.targets"
      - "global.json"
      - ".github/workflows/dotnet.yml"
  pull_request:
    paths:
      - ".net/**"
      - "Directory.Build.props"
      - "Directory.Build.targets"
      - "global.json"
      - ".github/workflows/dotnet.yml"

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: ".net/**/packages.lock.json"
      - name: Restore
        run: dotnet restore .net/XCelReportEngine.sln --locked-mode -m:1
      - name: Build
        run: dotnet build .net/XCelReportEngine.sln -c Release --no-restore -m:1 -p:SkipLabViewStaging=true
      - name: Test
        run: dotnet test .net/tests/XCelReportEngine.Tests/XCelReportEngine.Tests.csproj -c Release -f net48 --no-build --no-restore -m:1 --logger "console;verbosity=minimal"
      - name: Test .NET Framework 4.0
        run: .net/tests/XCelReportEngine.Tests/bin/Release/net40/XCelReportEngine.Tests.exe
